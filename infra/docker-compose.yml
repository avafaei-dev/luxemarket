services:
  db:
    image: postgres:16
    container_name: luxemarket_db
    environment:
      POSTGRES_DB: luxemarket
      POSTGRES_USER: luxe
      POSTGRES_PASSWORD: luxe_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxe -d luxemarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luxemarket_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: